name: Deploy server to Fly.io

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/engine/**
      - Dockerfile
      - fly.toml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
