<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Game Lobby</title>
  <link rel="icon" type="image/svg+xml" href="favicon-joker.svg" />
  <link rel="stylesheet" href="css/lobby.css" />
</head>
<body>
  <div class="lobby-bg" id="lobby-bg"></div>
  <div id="lobby-root"></div>
  <script>
    const panelIndex = Math.floor(Math.random() * 3);
    const bg = document.getElementById("lobby-bg");
    const img = new Image();
    img.src = "/assets/lobby-bg.jpg";
    img.decode().then(() => {
      const root = document.getElementById("lobby-root");
      function position() {
        const scale = window.innerHeight / img.naturalHeight;
        const fullW = Math.round(img.naturalWidth * scale);
        const panelW = Math.round(fullW / 3);
        bg.style.width = panelW + "px";
        bg.style.backgroundSize = fullW + "px 100%";
        const shifts = [8, 0, -21];
        const shift = shifts[panelIndex];
        bg.style.backgroundPosition = (-panelIndex * panelW + shift) + "px 0";
        root.style.width = panelW + "px";
      }
      position();
      window.addEventListener("resize", position);
    }).catch(() => {});
  </script>
  <script type="module" src="src/lobby/main.tsx"></script>
</body>
</html>
