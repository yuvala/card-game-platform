<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Card Game Player POV</title>
        <link rel="icon" type="image/svg+xml" href="favicon-joker.svg" />
        <link rel="stylesheet" href="css/app.css" type="text/css" />
        <style>
            html, body { height: 100%; overflow: hidden; }
            .playerFooter { display: none; }
            .playerShell.debug .playerFooter { display: block; }
            .playerSettings {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 100;
                align-items: flex-start;
                justify-content: flex-end;
                padding: 64px 16px 0;
            }
            .playerSettings.open { display: flex; }
            .playerSettingsBackdrop {
                position: fixed;
                inset: 0;
            }
            .playerSettingsPanel {
                position: relative;
                background: #0c2419;
                border: 1px solid rgba(255,209,102,0.28);
                border-radius: 14px;
                padding: 16px 20px;
                min-width: 200px;
                display: grid;
                gap: 12px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            }
            .playerSettingsTitle {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: rgba(243,234,213,0.5);
                margin: 0 0 4px;
            }
            .playerSettingsRow {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                font-size: 13px;
                color: #f3ead5;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="playerShell">
            <header class="playerHeader">
                <label class="playerSelectLabel" for="player-viewer-select">Viewing Seat</label>
                <select id="player-viewer-select" class="playerSelect"></select>
                <p id="player-status" class="playerStatus">Connecting to table...</p>
            </header>
            <main class="playerDeviceFrame">
                <div id="player-root" class="playerRoot"></div>
            </main>
            <div class="playerSettings" id="player-settings">
                <div class="playerSettingsBackdrop" id="player-settings-backdrop"></div>
                <div class="playerSettingsPanel">
                    <p class="playerSettingsTitle">Settings</p>
                    <label class="playerSettingsRow">
                        Show debug bar
                        <input type="checkbox" id="settings-debug-bar">
                    </label>
                    <label class="playerSettingsRow">
                        Zone overlay (D)
                        <input type="checkbox" id="settings-zones">
                    </label>
                </div>
            </div>
            <footer class="playerFooter">
                <kbd>D</kbd> — toggle zone overlay
                <span class="appDevSep">|</span>
                <label class="appDevCheck"><input type="checkbox" id="pdbg-hand"> HAND</label>
                <label class="appDevCheck"><input type="checkbox" id="pdbg-table"> TABLE</label>
                <label class="appDevCheck"><input type="checkbox" id="pdbg-piles"> PILES</label>
                <label class="appDevCheck"><input type="checkbox" id="pdbg-seats"> SEATS</label>
                <label class="appDevCheck"><input type="checkbox" id="pdbg-zones"> ZONES</label>
            </footer>
        </div>

        <script type="module" src="./src/app/playerMain.ts"></script>
        <script>
            (function () {
                const shell = document.querySelector(".playerShell");
                const settings = document.getElementById("player-settings");
                const backdrop = document.getElementById("player-settings-backdrop");
                const debugBarToggle = document.getElementById("settings-debug-bar");
                const zonesToggle = document.getElementById("settings-zones");

                // debug bar toggle
                const isDebug = localStorage.getItem("player-dbg-bar") === "on" ||
                    new URLSearchParams(location.search).get("debug") === "1";
                debugBarToggle.checked = isDebug;
                if (isDebug) shell.classList.add("debug");
                debugBarToggle.addEventListener("change", () => {
                    localStorage.setItem("player-dbg-bar", debugBarToggle.checked ? "on" : "off");
                    shell.classList.toggle("debug", debugBarToggle.checked);
                });

                // zone overlay toggle
                zonesToggle.checked = localStorage.getItem("player-debug-zones") === "on";
                zonesToggle.addEventListener("change", () => {
                    localStorage.setItem("player-debug-zones", zonesToggle.checked ? "on" : "off");
                    globalThis.dispatchEvent(new Event("debug-layer-change"));
                });

                // settings panel open/close
                globalThis.addEventListener("player-settings-toggle", () => {
                    settings.classList.toggle("open");
                });
                backdrop.addEventListener("click", () => {
                    settings.classList.remove("open");
                });

                // debug checkboxes (for the footer bar layers)
                const keys = {
                    hand:  "pdbg-hand",
                    table: "pdbg-table",
                    piles: "pdbg-piles",
                    seats: "pdbg-seats",
                    zones: "pdbg-zones"
                };
                Object.entries(keys).forEach(([layer, id]) => {
                    const el = document.getElementById(id);
                    el.checked = localStorage.getItem("player-dbg-" + layer) === "on";
                    el.addEventListener("change", () => {
                        localStorage.setItem("player-dbg-" + layer, el.checked ? "on" : "off");
                        globalThis.dispatchEvent(new Event("debug-layer-change"));
                    });
                });
            })();
        </script>
    </body>
</html>
