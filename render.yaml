services:
  - type: web
    name: card-game-server
    runtime: node
    buildCommand: npm install && npx tsc -p tsconfig.server.json && node scripts/resolve-engine-aliases.cjs .tmp-server
    startCommand: node .tmp-server/apps/server/src/gameServer.js
    envVars:
      - key: HOST
        value: 0.0.0.0
    plan: free
