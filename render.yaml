services:
  - type: web
    name: card-game-server
    runtime: node
    buildCommand: npm install && npx tsc -p tsconfig.server.json && node scripts/resolve-engine-aliases.cjs .tmp-server
    startCommand: node .tmp-server/apps/server/src/gameServer.js
    envVars:
      - key: HOST
        value: 0.0.0.0
    plan: free

  - type: web
    name: card-game-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_WS_URL
        value: wss://card-game-server.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    plan: free
