<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Card Game Table</title>
        <link rel="stylesheet" href="css/app.css" type="text/css" />
    </head>
    <body>
        <div class="appShell">
            <div class="appIntro">
                <p class="appEyebrow">Card Game</p>
                <h1 id="game-title">Card Game</h1>
                <p>
                    The legacy DOM version is frozen and kept only
                    for reference at
                    <a href="/game.html">/game.html</a>.
                </p>
                <p>
                   sandbox
                    <a href="/card-sandbox.html">Card Visual Sandbox</a>.
                </p>
                <p>
                    Click on Change Game to choose a ruleset, player count, and deck before opening the
                    table.
                </p>
            </div>
            <div id="game-setup" class="appSetupMount"></div>
            <div id="game-root" class="appRoot"></div>
            <div class="appDevHints">
                <kbd>D</kbd> — toggle zone overlay
                <span class="appDevSep">|</span>
                <label class="appDevCheck"><input type="checkbox" id="dbg-origins"> ORIGIN</label>
                <label class="appDevCheck"><input type="checkbox" id="dbg-slots"> SLOT</label>
                <label class="appDevCheck"><input type="checkbox" id="dbg-piles"> PILE</label>
            </div>
        </div>

        <script type="module" src="./src/app/main.ts"></script>
        <script>
            (function () {
                const keys = { origins: "dbg-origins", slots: "dbg-slots", piles: "dbg-piles" };
                Object.entries(keys).forEach(([layer, id]) => {
                    const el = document.getElementById(id);
                    el.checked = localStorage.getItem("debug-layer-" + layer) === "on";
                    el.addEventListener("change", () => {
                        localStorage.setItem("debug-layer-" + layer, el.checked ? "on" : "off");
                        globalThis.dispatchEvent(new Event("debug-layer-change"));
                    });
                });
            })();
        </script>
    </body>
</html>
