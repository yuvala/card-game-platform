<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Card Visual Sandbox</title>
        <link rel="stylesheet" href="css/app.css" type="text/css" />
    </head>
    <body>
        <div class="cardSandboxShell">
            <header class="cardSandboxHeader">
                <div>
                    <p class="appEyebrow">Dev Tool</p>
                    <h1>Card Visual Sandbox</h1>
                </div>
                <div class="cardSandboxControls">
                    <label class="playerSelectLabel" for="card-sandbox-deck">Deck</label>
                    <select id="card-sandbox-deck" class="playerSelect"></select>
                    <button id="card-sandbox-replay" class="appPrimaryButton" type="button">Replay</button>
                </div>
            </header>
            <nav class="cardSandboxTabs" aria-label="Card sandbox sections">
                <button class="cardSandboxTab is-active" type="button" data-card-sandbox-section="real">Real Cards</button>
                <button class="cardSandboxTab" type="button" data-card-sandbox-section="ghost">Ghost Cards</button>
                <button class="cardSandboxTab" type="button" data-card-sandbox-section="layer">Animation Layers</button>
            </nav>
            <main id="card-sandbox-root" class="cardSandboxRoot"></main>
        </div>

        <script type="module" src="./src/app/dev/cardSandboxMain.ts"></script>
    </body>
</html>
