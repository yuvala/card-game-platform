<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Game Lobby</title>
  <link rel="icon" type="image/svg+xml" href="favicon-joker.svg" />
  <link rel="stylesheet" href="css/lobby.css" />
</head>
<body>
  <div class="lobby-bg" id="lobby-bg"></div>
  <div id="lobby-root"></div>
  <script>
    const panelIndex = Math.floor(Math.random() * 3);
    const bg = document.getElementById("lobby-bg");
    const img = new Image();
    img.src = "/assets/lobby-bg.jpg";
    function position() {
      const scale = window.innerHeight / img.naturalHeight;
      const panelWidth = (img.naturalWidth * scale) / 3;
      bg.style.width = panelWidth + "px";
      bg.style.backgroundPosition = (-panelIndex * panelWidth) + "px center";
    }
    img.onload = () => {
      position();
      window.addEventListener("resize", position);
    };
  </script>
  <script type="module" src="src/lobby/main.tsx"></script>
</body>
</html>
